taiwan_housing_bigquery:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: taiwan-household
      # Actual datasets come from macros/generate_schema_name.sql (housing_silver, housing_gold).
      dataset: housing_gold
      location: US
      threads: 1
      job_execution_timeout_seconds: 60
      job_retries: 0
    ci:
      # GitHub Actions: google-github-actions/auth writes short-lived WIF credentials as ADC.
      # The ci service account can only write ci_housing_silver / ci_housing_gold.
      type: bigquery
      method: oauth
      project: taiwan-household
      dataset: ci_housing_gold
      location: US
      threads: 1
      job_execution_timeout_seconds: 300
      job_retries: 1
