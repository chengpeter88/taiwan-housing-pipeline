version: 2

# Gold 層單元測試：以小資料手算期望值，驗證衍生欄位邊界與彙總口徑。
unit_tests:
  # ---------- fct_housing_deal：屋齡（整年數，未滿週年要減 1） ----------
  - name: fct_building_age_uses_completed_full_years
    model: fct_housing_deal
    given:
      - input: ref('stg_lvr_sale')
        rows:
          - &fbase {source_row_key: 'a1', source_sha256: 'h', city_code: 'A', district: '中山區',
             serial_no: 'S', transaction_date: '2026-03-15', main_use: '住家用',
             building_type: '住宅大樓(11層含以上有電梯)', is_residential: true,
             parking_status: 'no_parking', housing_price: 10000000, housing_area: 66.1158,
             total_price: 10000000, completion_date: '2016-03-16', room_count: 3,
             has_elevator: true, has_management: true, is_price_eligible: true}
          - {<<: *fbase, source_row_key: 'a2', completion_date: '2016-03-15'}
          - {<<: *fbase, source_row_key: 'a3', completion_date: '2016-03-14'}
          - {<<: *fbase, source_row_key: 'a4', completion_date: '1996-03-15'}
          - {<<: *fbase, source_row_key: 'a5', completion_date: '2026-03-15'}
          # 完成日晚於交易日：屋齡未知
          - {<<: *fbase, source_row_key: 'a6', completion_date: '2026-03-16'}
          - {<<: *fbase, source_row_key: 'a7', completion_date: null}
          # 2/29 完成：非閏年 2/28 還沒滿週年，3/1 才滿
          - {<<: *fbase, source_row_key: 'a8', completion_date: '2016-02-29', transaction_date: '2026-02-28'}
          - {<<: *fbase, source_row_key: 'a9', completion_date: '2016-02-29', transaction_date: '2026-03-01'}
          # 不合格交易不進 fact
          - {<<: *fbase, source_row_key: 'a10', is_price_eligible: false}
    expect:
      rows:
        - {source_row_key: 'a1', building_age_years: 9, age_band: '0-10'}
        - {source_row_key: 'a2', building_age_years: 10, age_band: '10-30'}
        - {source_row_key: 'a3', building_age_years: 10, age_band: '10-30'}
        - {source_row_key: 'a4', building_age_years: 30, age_band: '30+'}
        - {source_row_key: 'a5', building_age_years: 0, age_band: '0-10'}
        - {source_row_key: 'a6', building_age_years: null, age_band: 'unknown'}
        - {source_row_key: 'a7', building_age_years: null, age_band: 'unknown'}
        - {source_row_key: 'a8', building_age_years: 9, age_band: '0-10'}
        - {source_row_key: 'a9', building_age_years: 10, age_band: '10-30'}

  # ---------- fct_housing_deal：分組與金額欄位 ----------
  - name: fct_bands_groups_and_prices
    model: fct_housing_deal
    given:
      - input: ref('stg_lvr_sale')
        rows:
          # 面積邊界由平方公尺回推：15 坪 = 49.58685 平方公尺
          - {<<: *fbase, source_row_key: 'b1', housing_area: 49.5, total_price: 9999999}
          - {<<: *fbase, source_row_key: 'b2', housing_area: 49.58685, total_price: 10000000}
          - {<<: *fbase, source_row_key: 'b3', housing_area: 82.64475, total_price: 15000000}
          - {<<: *fbase, source_row_key: 'b4', housing_area: 115.70265, total_price: 20000000}
          - {<<: *fbase, source_row_key: 'b5', housing_area: 165.2895, total_price: 30000000}
          - {<<: *fbase, source_row_key: 'b6', total_price: 50000000}
          - {<<: *fbase, source_row_key: 'g1', building_type: '華廈(10層含以下有電梯)'}
          - {<<: *fbase, source_row_key: 'g2', building_type: '公寓(5樓含以下無電梯)'}
          - {<<: *fbase, source_row_key: 'g3', building_type: '透天厝'}
          - {<<: *fbase, source_row_key: 'g4', building_type: '店面(店鋪)'}
          - {<<: *fbase, source_row_key: 'g5', building_type: ' 住宅大樓(11層含以上有電梯)'}
          # 含車位：總價含車位，扣車位價另列
          - {<<: *fbase, source_row_key: 'p1', parking_status: 'separately_reported',
             total_price: 12000000, housing_price: 10000000}
    expect:
      rows:
        - {source_row_key: 'b1', area_band: '<15', budget_band: '<1000', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'b2', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'b3', area_band: '25-35', budget_band: '1500-2000', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'b4', area_band: '35-50', budget_band: '2000-3000', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'b5', area_band: '50+', budget_band: '3000-5000', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'b6', area_band: '15-25', budget_band: '5000+', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'g1', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'mansion', is_parking_included: false}
        - {source_row_key: 'g2', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'apartment', is_parking_included: false}
        - {source_row_key: 'g3', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'townhouse', is_parking_included: false}
        - {source_row_key: 'g4', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'other', is_parking_included: false}
        - {source_row_key: 'g5', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'tower', is_parking_included: false}
        - {source_row_key: 'p1', area_band: '15-25', budget_band: '1000-1500', building_type_group: 'tower', is_parking_included: true}

  - name: fct_price_in_10k_units
    model: fct_housing_deal
    given:
      - input: ref('stg_lvr_sale')
        rows:
          - {<<: *fbase, source_row_key: 'm1', parking_status: 'separately_reported',
             total_price: 12000000, housing_price: 10000000, transaction_date: '2026-02-10'}
    expect:
      rows:
        - {source_row_key: 'm1', total_price_incl_parking_10k: 1200, housing_price_10k: 1000,
           transaction_month: '2026-02-01', transaction_quarter: '2026-01-01'}

  # ---------- agg_district_quarter_price：精確分位數與以日期 join 的年增率 ----------
  - name: quarter_price_quartiles_and_yoy
    model: agg_district_quarter_price
    overrides:
      vars: {low_sample_threshold: 1}
    given:
      - input: ref('fct_housing_deal')
        rows:
          - &abase {city_code: 'A', district: '中山區', is_residential: true,
             transaction_quarter: '2024-01-01', price_per_ping: 100}
          - {<<: *abase, price_per_ping: 200}
          - {<<: *abase, transaction_quarter: '2025-01-01', price_per_ping: 180}
          # 前一年同季沒有成交
          - {<<: *abase, transaction_quarter: '2025-04-01', price_per_ping: 90}
          # 非住宅不計入
          - {<<: *abase, transaction_quarter: '2025-01-01', price_per_ping: 999, is_residential: false}
          # 中間缺季也不會錯位（不用 LAG）
          - {<<: *abase, district: '大安區', transaction_quarter: '2024-01-01', price_per_ping: 100}
          - {<<: *abase, district: '大安區', transaction_quarter: '2025-01-01', price_per_ping: 150}
    expect:
      rows:
        - {city_code: 'A', district: '中山區', transaction_quarter: '2024-01-01', deal_count: 2,
           p25_price_per_ping: 125, median_price_per_ping: 150, p75_price_per_ping: 175,
           prev_year_median_price_per_ping: null, median_yoy_ratio: null, is_low_sample: false}
        - {city_code: 'A', district: '中山區', transaction_quarter: '2025-01-01', deal_count: 1,
           p25_price_per_ping: 180, median_price_per_ping: 180, p75_price_per_ping: 180,
           prev_year_median_price_per_ping: 150, median_yoy_ratio: 0.2, is_low_sample: false}
        - {city_code: 'A', district: '中山區', transaction_quarter: '2025-04-01', deal_count: 1,
           p25_price_per_ping: 90, median_price_per_ping: 90, p75_price_per_ping: 90,
           prev_year_median_price_per_ping: null, median_yoy_ratio: null, is_low_sample: false}
        - {city_code: 'A', district: '大安區', transaction_quarter: '2024-01-01', deal_count: 1,
           p25_price_per_ping: 100, median_price_per_ping: 100, p75_price_per_ping: 100,
           prev_year_median_price_per_ping: null, median_yoy_ratio: null, is_low_sample: false}
        - {city_code: 'A', district: '大安區', transaction_quarter: '2025-01-01', deal_count: 1,
           p25_price_per_ping: 150, median_price_per_ping: 150, p75_price_per_ping: 150,
           prev_year_median_price_per_ping: 100, median_yoy_ratio: 0.5, is_low_sample: false}

  - name: quarter_yoy_is_null_when_low_sample
    model: agg_district_quarter_price
    overrides:
      vars: {low_sample_threshold: 2}
    given:
      - input: ref('fct_housing_deal')
        rows:
          - {<<: *abase, price_per_ping: 100}
          - {<<: *abase, price_per_ping: 200}
          - {<<: *abase, transaction_quarter: '2025-01-01', price_per_ping: 180}
    expect:
      rows:
        - {transaction_quarter: '2024-01-01', deal_count: 2, median_yoy_ratio: null, is_low_sample: false}
        - {transaction_quarter: '2025-01-01', deal_count: 1, median_yoy_ratio: null, is_low_sample: true}

  # ---------- agg_district_segment_price ----------
  - name: segment_price_by_type_and_age
    model: agg_district_segment_price
    overrides:
      vars: {low_sample_threshold: 2}
    given:
      - input: ref('fct_housing_deal')
        rows:
          - &sbase {city_code: 'A', district: '中山區', is_residential: true,
             building_type_group: 'tower', age_band: '0-10', price_per_ping: 100,
             total_price_incl_parking_10k: 1000}
          - {<<: *sbase, price_per_ping: 300, total_price_incl_parking_10k: 2000}
          - {<<: *sbase, building_type_group: 'apartment', age_band: '30+', price_per_ping: 50,
             total_price_incl_parking_10k: 800}
          - {<<: *sbase, price_per_ping: 999, is_residential: false}
    expect:
      rows:
        - {city_code: 'A', district: '中山區', building_type_group: 'tower', age_band: '0-10',
           deal_count: 2, p25_price_per_ping: 150, median_price_per_ping: 200,
           p75_price_per_ping: 250, median_total_price_incl_parking_10k: 1500, is_low_sample: false}
        - {city_code: 'A', district: '中山區', building_type_group: 'apartment', age_band: '30+',
           deal_count: 1, p25_price_per_ping: 50, median_price_per_ping: 50,
           p75_price_per_ping: 50, median_total_price_incl_parking_10k: 800, is_low_sample: true}

  # ---------- agg_district_budget：最近 N 個月、NULL 與 0 房處理 ----------
  - name: budget_recent_window_and_null_handling
    model: agg_district_budget
    overrides:
      vars: {as_of_date: '2025-12-31', budget_months: 2, low_sample_threshold: 2}
    given:
      - input: ref('fct_housing_deal')
        rows:
          - &bbase {city_code: 'A', district: '中山區', is_residential: true,
             transaction_month: '2025-12-01', budget_band: '<1000', housing_area_ping: 20,
             building_age_years: 5, room_count: 2, has_elevator: true,
             is_parking_included: false, price_per_ping: 500000}
          - {<<: *bbase, transaction_month: '2025-11-01', housing_area_ping: 24,
             building_age_years: 7, room_count: 0, has_elevator: false,
             is_parking_included: true, price_per_ping: 600000}
          - {<<: *bbase, transaction_month: '2025-11-01', budget_band: '1000-1500',
             housing_area_ping: 30, building_age_years: null, room_count: 3, has_elevator: null,
             price_per_ping: 700000}
          - {<<: *bbase, budget_band: '1000-1500', housing_area_ping: 40,
             building_age_years: 40, room_count: 4, has_elevator: true, price_per_ping: 800000}
          # 視窗外（2025-10）不計入
          - {<<: *bbase, transaction_month: '2025-10-01', price_per_ping: 1}
          - {<<: *bbase, is_residential: false, price_per_ping: 1}
          - {<<: *bbase, district: '大安區', price_per_ping: 400000}
    expect:
      rows:
        - {city_code: 'A', district: '中山區', budget_band: '<1000', deal_count: 2,
           share_of_district_deals: 0.5, median_housing_area_ping: 22,
           median_building_age_years: 6, age_known_count: 2, median_room_count: 2,
           room_known_count: 1, elevator_share: 0.5, parking_included_share: 0.5,
           median_price_per_ping: 550000, is_low_sample: false}
        - {city_code: 'A', district: '中山區', budget_band: '1000-1500', deal_count: 2,
           share_of_district_deals: 0.5, median_housing_area_ping: 35,
           median_building_age_years: 40, age_known_count: 1, median_room_count: 3,
           room_known_count: 2, elevator_share: 1.0, parking_included_share: 0.0,
           median_price_per_ping: 750000, is_low_sample: false}
        - {city_code: 'A', district: '大安區', budget_band: '<1000', deal_count: 1,
           share_of_district_deals: 1.0, median_housing_area_ping: 20,
           median_building_age_years: 5, age_known_count: 1, median_room_count: 2,
           room_known_count: 1, elevator_share: 1.0, parking_included_share: 0.0,
           median_price_per_ping: 400000, is_low_sample: true}

  # ---------- agg_city_month_market：滾動 3 個月中位數由逐筆交易重算 ----------
  - name: city_month_rolling_median_from_deals
    model: agg_city_month_market
    overrides:
      vars: {min_transaction_date: '2025-01-01', as_of_date: '2025-04-30'}
    given:
      - input: ref('fct_housing_deal')
        rows:
          - &cbase {city_code: 'A', district: '中山區', is_residential: true,
             transaction_month: '2025-01-01', price_per_ping: 10}
          - {<<: *cbase, transaction_month: '2025-02-01', price_per_ping: 20}
          - {<<: *cbase, transaction_month: '2025-02-01', district: '大安區', price_per_ping: 40}
          - {<<: *cbase, transaction_month: '2025-03-01', price_per_ping: 30}
          - {<<: *cbase, transaction_month: '2025-03-01', price_per_ping: 999, is_residential: false}
          - {<<: *cbase, transaction_month: '2025-04-01', price_per_ping: 100}
          # 一年前同月，用來驗證成交量年增率
          - {<<: *cbase, transaction_month: '2024-04-01', price_per_ping: 50}
    expect:
      rows:
        - {transaction_month: '2024-04-01', deal_count: 1, median_price_per_ping: 50,
           rolling_3m_median_price_per_ping: 50, rolling_3m_deal_count: 1,
           is_rolling_window_complete: false, deal_count_yoy_ratio: null}
        - {transaction_month: '2025-01-01', deal_count: 1, median_price_per_ping: 10,
           rolling_3m_median_price_per_ping: 10, rolling_3m_deal_count: 1,
           is_rolling_window_complete: false, deal_count_yoy_ratio: null}
        - {transaction_month: '2025-02-01', deal_count: 2, median_price_per_ping: 30,
           rolling_3m_median_price_per_ping: 20, rolling_3m_deal_count: 3,
           is_rolling_window_complete: false, deal_count_yoy_ratio: null}
        - {transaction_month: '2025-03-01', deal_count: 1, median_price_per_ping: 30,
           rolling_3m_median_price_per_ping: 25, rolling_3m_deal_count: 4,
           is_rolling_window_complete: true, deal_count_yoy_ratio: null}
        # 2025-04 的滾動窗口是 2–4 月（20、40、30、100），不含 1 月
        - {transaction_month: '2025-04-01', deal_count: 1, median_price_per_ping: 100,
           rolling_3m_median_price_per_ping: 35, rolling_3m_deal_count: 4,
           is_rolling_window_complete: true, deal_count_yoy_ratio: 0.0}
