taiwan_housing:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('HOUSING_DB') }}"
      threads: 2
    bq:
      type: bigquery
      method: oauth
      project: taiwan-household
      dataset: housing_dev
      location: asia-east1
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 1000000000
